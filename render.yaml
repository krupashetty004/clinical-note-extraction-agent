services:
  - type: web
    name: mirai-clinical-note-agent
    runtime: python
    plan: free
    buildCommand: bash ./build.sh
    startCommand: "python manage.py migrate --noinput && python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: DATABASE_URL
        sync: false
